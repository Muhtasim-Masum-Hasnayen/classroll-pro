<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="ClassRoll Pro preview">
<style>
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes swap{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
@keyframes swap2{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
.g{transform-box:fill-box;transform-origin:left;animation:grow 1.6s ease both}
.fl{animation:float 5s ease-in-out infinite}
.pu{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
.s1{animation:swap 8s infinite}.s2{animation:swap2 8s infinite}
</style>
<rect width="1000" height="480" rx="24" fill="#f4f8fc"/>
<rect x="0" y="0" width="1000" height="56" rx="24" fill="#fff"/><rect x="0" y="30" width="1000" height="26" fill="#fff"/>
<circle cx="32" cy="28" r="6" fill="#ff5f57"/><circle cx="54" cy="28" r="6" fill="#febc2e"/><circle cx="76" cy="28" r="6" fill="#28c840"/>
<text x="500" y="34" font-size="14" fill="#5b6b7c" text-anchor="middle">classroll-pro.vercel.app</text>
<g class="fl">
<rect x="60" y="90" width="400" height="350" rx="24" fill="#fff" stroke="#e2e9f1"/>
<text x="90" y="128" font-size="15" font-weight="700" fill="#0b1f33">Smart Card View</text>
<rect x="90" y="142" width="340" height="8" rx="4" fill="#e2e9f1"/><rect class="g" x="90" y="142" width="226" height="8" rx="4" fill="#0e5fd8"/>
<circle cx="260" cy="214" r="42" fill="#0fb5a6"/><text x="260" y="228" font-size="38" font-weight="800" fill="#fff" text-anchor="middle">T</text>
<text x="260" y="284" font-size="22" font-weight="700" fill="#0b1f33" text-anchor="middle">Tanvir Hasan</text>
<text x="260" y="306" font-size="14" fill="#5b6b7c" text-anchor="middle">Roll 03 · Class 8-A</text>
<g class="pu"><rect x="90" y="326" width="165" height="62" rx="16" fill="#16a34a"/><text x="172" y="365" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">Present</text></g>
<rect x="265" y="326" width="165" height="62" rx="16" fill="#dc2626"/><text x="347" y="365" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">Absent</text>
<text x="260" y="418" font-size="13" fill="#5b6b7c" text-anchor="middle">Tap the card to open the full profile</text>
</g>
<g>
<rect x="500" y="90" width="440" height="350" rx="24" fill="#fff" stroke="#e2e9f1"/>
<text x="530" y="128" font-size="15" font-weight="700" fill="#0b1f33">Attendance report</text>
<g font-size="14" fill="#0b1f33"><text x="530" y="174">Rahim</text><text x="530" y="220">Nusrat</text><text x="530" y="266">Tanvir</text><text x="530" y="312">Sadia</text></g>
<g><rect x="610" y="160" width="250" height="14" rx="7" fill="#e2e9f1"/><rect class="g" x="610" y="160" width="225" height="14" rx="7" fill="#16a34a"/>
<rect x="610" y="206" width="250" height="14" rx="7" fill="#e2e9f1"/><rect class="g" x="610" y="206" width="238" height="14" rx="7" fill="#16a34a" style="animation-delay:.2s"/>
<rect x="610" y="252" width="250" height="14" rx="7" fill="#e2e9f1"/><rect class="g" x="610" y="252" width="150" height="14" rx="7" fill="#dc2626" style="animation-delay:.4s"/>
<rect x="610" y="298" width="250" height="14" rx="7" fill="#e2e9f1"/><rect class="g" x="610" y="298" width="205" height="14" rx="7" fill="#16a34a" style="animation-delay:.6s"/></g>
<g font-size="13" font-weight="700"><text x="872" y="172" fill="#16a34a">90%</text><text x="872" y="218" fill="#16a34a">95%</text><text x="872" y="264" fill="#dc2626">60%</text><text x="872" y="310" fill="#16a34a">82%</text></g>
<rect x="530" y="340" width="380" height="76" rx="14" fill="#fee2e2"/>
<g class="s1"><text x="550" y="384" font-size="15" font-weight="700" fill="#991b1b">⚠ Low attendance alert</text></g>
<g class="s2"><text x="550" y="384" font-size="15" font-weight="700" fill="#991b1b">⚠ Tanvir is below 75%</text></g>
</g>
</svg>
