<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="ClassRoll Pro banner">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b3fa8"/><stop offset=".55" stop-color="#0e5fd8"/><stop offset="1" stop-color="#0fb5a6"/></linearGradient>
<clipPath id="r"><rect width="1200" height="360" rx="24"/></clipPath>
</defs>
<style>
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(24px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.f1{animation:float 6s ease-in-out infinite}.f2{animation:float 8s ease-in-out infinite reverse}.d1{animation:drift 9s ease-in-out infinite}
.ck{stroke-dasharray:90;stroke-dashoffset:90;animation:draw 1.1s .4s ease forwards}
.t1{animation:rise .9s .2s both}.t2{animation:rise .9s .5s both}.t3{animation:rise .9s .8s both}
.pu{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-in-out infinite}
.bl{animation:blink 1.6s infinite}
.card{animation:float 5s ease-in-out infinite}
</style>
<g clip-path="url(#r)">
<rect width="1200" height="360" fill="url(#bg)"/>
<circle class="f1" cx="130" cy="300" r="120" fill="#fff" opacity=".07"/>
<circle class="f2" cx="620" cy="60" r="90" fill="#fff" opacity=".08"/>
<circle class="d1" cx="1120" cy="320" r="140" fill="#fff" opacity=".07"/>
<g transform="translate(70,70)">
<rect width="74" height="74" rx="20" fill="#fff" opacity=".18"/>
<path class="ck" d="M20 38l12 12 24-28" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text class="t1" x="70" y="205" font-size="64" font-weight="800" fill="#fff">ClassRoll Pro</text>
<text class="t2" x="72" y="248" font-size="24" fill="#e6f3ff">Smart card-based attendance for teachers</text>
<text class="t3" x="72" y="290" font-size="18" fill="#bfe3ff">Bangla + English  ·  Excel import  ·  Reports  ·  Dark mode</text>
<g class="card">
<rect x="810" y="52" width="290" height="256" rx="26" fill="#fff" opacity=".96"/>
<circle cx="955" cy="118" r="36" fill="#0e5fd8"/>
<text x="955" y="130" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">N</text>
<text x="955" y="182" font-size="21" font-weight="700" fill="#0b1f33" text-anchor="middle">Nusrat Jahan</text>
<text x="955" y="204" font-size="14" fill="#5b6b7c" text-anchor="middle">Roll 02 · Class 8-A</text>
<g class="pu"><rect x="834" y="226" width="116" height="56" rx="14" fill="#16a34a"/><text x="892" y="261" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">Present</text></g>
<rect x="960" y="226" width="116" height="56" rx="14" fill="#dc2626"/><text x="1018" y="261" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">Absent</text>
<circle class="bl" cx="1076" cy="76" r="6" fill="#16a34a"/>
</g>
</g>
</svg>
